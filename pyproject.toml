[project]
name = "llm-gateway"
version = "0.1.0"
description = "Production-inspired multi-provider LLM orchestration gateway"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "litellm==1.40.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "redis==5.0.7",
    "faiss-cpu==1.8.0",
    "sentence-transformers==3.0.1",
    "presidio-analyzer==2.2.354",
    "presidio-anonymizer==2.2.354",
    "slowapi==0.1.9",
    "tenacity==8.3.0",
    "langfuse==2.36.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "python-dotenv==1.0.1",
    "pydantic==2.8.0",
    "pydantic-settings==2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
]

[tool.ruff]
line-height = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]